<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar, Eliminar Empleado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
<!-- navbar -->
<nav class="navbar navbar-expand-lg bg-secondary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">
            <img th:src="@{/images/icono.ico}" alt="Logo" width="40" height="40">
        </a>
        <h4 class="text-center"> Sistema de consulta de empleados</h4>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
        </div>
    </div>
</nav>
<!-- cuerpo -->
<div class="container">
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <br>
            <button>Regresar al inicio</button>
            <hr>
            <br>
            <h2 class=" text-center mb-4" >Editar empleado</h2>

            <form th:action="@{/employee/editar}" th:object="${employee}" method="post">

                <input type="hidden" th:field="*{empNo}">

                <!-- fila de numero de empleado, nombre y apellido -->
                <div class="row md-3">
                    <!-- numero de empleado -->
                    <div class="col-12 col-md-3">
                        <label class="form-label">Número de empleado</label>
                        <input type="text" th:value="${employee.empNo}" class="form-control" readonly>
                    </div>

                    <!-- nombre -->
                    <div class="col-12 col-md-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" th:value="${employee.firstName}" class="form-control">
                    </div>

                    <!-- apellido -->
                    <div class="col-12 col-md-3">
                        <label class="form-label">Apellido</label>
                        <input type="text" th:value="${employee.lastName}" class="form-control">
                    </div>
                </div>
                <br>

                <!-- fila de genero, fecha de nacimiento y fecha de contratacion -->
                <div class="row md-3">
                    <!-- genero -->
                    <div class="col-12 col-md-3">
                        <label class="form-label">Género</label>
                        <select th:field="*{gender}" class="form-select">
                            <option value="M">Masculino</option>
                            <option value="F">Femenino</option>
                        </select>
                    </div>

                    <!-- Nacimineto -->
                    <div class="col-12 col-md-3">
                        <label class="form-label">Nacimineto</label>
                        <input type="date" th:field="*{birthDate}" class="form-control">
                    </div>

                    <!-- contratacion -->
                    <div class="col-12 col-md-3">
                        <label class="form-label">Contratacion</label>
                        <input type="date" th:field="*{hireDate}" class="form-control">
                    </div>
                </div>
                <br>

                <!-- fila de departamento, fecha "desde" la contraracion y la fecha de "hasta" que significa que aun sigue laborando -->
                <div class="row md-3">
                    <!-- departamento -->
                   <div class="col 12 col-md-3">
                       <label class="form-label">Departamento</label>
                       <input type="text" th:field="*{deptNo}" class="form-control">
                   </div>

                    <!-- desde -->
                    <div class="col 12 col-md-3">
                        <label class="form-label">Desde</label>
                        <input type="date" th:field="*{fromDate}" class="form-control">
                    </div>

                    <!-- hasta -->
                    <div class="col 12 col-md-3">
                        <label class="form-label" >Hasta</label>
                        <input type="date" th:field="*{toDate}" class="form-control">
                    </div>
                </div>

                <br>
                <!-- boton de guardar cambios -->
                <button type="submit" class="btn btn-primary" >Guardar cambios</button>
                <a th:href="@{/employee/editar}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>

</div>

</body>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</html>
